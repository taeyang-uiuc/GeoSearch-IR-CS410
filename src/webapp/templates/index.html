<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GeoSearch-IR Validator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      color-scheme: light;
      font: 15px/1.5 "DM Sans", system-ui, sans-serif;
      color: #192c29;
      background: #f2f5f2;
      --muted: #526761;
      --border: #dbe5de;
      --accent: #17634f;
      --surface: #fff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, p { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #33846c; outline-offset: 3px; }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 24px;
      padding: 14px clamp(16px, 3vw, 40px);
      background: #143d34;
      color: #fff;
    }

    .masthead h1 { font-size: 1.4rem; letter-spacing: -.035em; }
    #status { font-size: .875rem; color: #d9eee5; overflow-wrap: anywhere; }

    .workspace {
      width: min(100%, 1680px);
      margin-inline: auto;
      padding: clamp(12px, 2vw, 28px);
      display: grid;
      gap: 16px;
    }

    #controls, #sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(12px, 2vw, 20px);
    }

    #controls {
      display: grid;
      grid-template-columns: minmax(200px, 2.4fr) repeat(4, minmax(90px, 1fr)) auto;
      align-items: end;
      gap: 12px;
    }

    .field { display: grid; gap: 4px; min-width: 0; font-weight: 700; font-size: .81rem; }
    input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: inherit;
      background: #f8fbf9;
      font-size: 1rem;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ebf4ef;
      color: #194e40;
      font-weight: 700;
    }

    .action.primary { background: var(--accent); color: #fff; border-color: transparent; }
    .action:hover { filter: brightness(.94); }

    #main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(275px, 345px);
      height: max(480px, calc(100dvh - 177px));
      gap: 16px;
    }

    #map { min-width: 0; border: 1px solid var(--border); border-radius: 16px; background: #e3ebe5; }
    #sidebar { min-width: 0; overflow: auto; }
    #sidebar h2 { font-size: 1.1rem; letter-spacing: -.02em; margin-bottom: 10px; }
    .empty { color: var(--muted); font-size: .9rem; }
    .result-card {
      display: grid;
      width: 100%;
      gap: 4px;
      text-align: left;
      color: inherit;
      margin-bottom: 9px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fbf9;
      overflow-wrap: anywhere;
    }

    .result-card:hover { background: #eaf5ef; border-color: #99c7b5; }
    .result-card .rank, .result-card .scores { color: var(--accent); font-size: .79rem; font-weight: 700; }
    .result-card .name { font-weight: 700; }
    .result-card .meta { color: var(--muted); font-size: .86rem; }
    .amenities { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    .amenity { display: inline-block; padding: 3px 7px; border-radius: 6px; background: #e7f3eb; color: #19533d; font-size: .78rem; font-weight: 600; }
    .amenity.no { background: #f7e9e5; color: #8b3c2b; }
    .amenity.unknown { background: #edf0ef; color: #586a64; }
    .amenity.detail { background: #edf2f8; color: #344f70; }
    .venue-popup { min-width: 220px; max-width: 290px; color: #192c29; }
    .venue-popup .popup-name { font-size: 1.08rem; line-height: 1.25; font-weight: 700; }
    .venue-popup .popup-address { color: var(--muted); font-size: .84rem; margin: 3px 0 10px; }
    .venue-popup .popup-metrics { display: grid; gap: 3px; padding: 8px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: .86rem; }
    .venue-popup .popup-metrics strong { color: var(--accent); }
    .venue-popup details { margin-top: 8px; font-size: .77rem; color: var(--muted); }
    .venue-popup summary { cursor: pointer; font-weight: 700; }
    .venue-popup .popup-amenities { max-height: 120px; overflow-y: auto; gap: 4px; margin-bottom: 0; }
    .venue-popup .amenity { font-size: .72rem; padding: 2px 5px; }

    #saved-panel { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
    #saved-panel .actions { margin: 8px 0 12px; }
    .saved-entry { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .saved-entry button {
      min-height: 44px;
      min-width: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fbf9;
      color: #194e40;
      padding: 6px 9px;
    }

    .saved-entry .saved-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .saved-entry button:hover { background: #eaf5ef; }

    @media (max-width: 1100px) {
      #controls { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .query-field, #controls .actions { grid-column: span 2; }
      #main { height: max(480px, calc(100dvh - 240px)); }
    }

    @media (max-width: 720px) {
      #controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #controls .actions > * { flex: 1; }
      #main { grid-template-columns: minmax(0, 1fr); height: auto; }
      #map { height: clamp(280px, 48dvh, 450px); }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <h1>GeoSearch-IR</h1>
    <p id="status" role="status">Loading restaurants…</p>
  </header>

  <main class="workspace">
    <form id="controls" aria-label="Restaurant search">
      <label class="field query-field">Search restaurants
        <input type="search" id="query" placeholder="e.g. quiet pizza with outdoor seating" />
      </label>
      <label class="field">Latitude
        <input type="number" id="lat" min="-90" max="90" step="any" />
      </label>
      <label class="field">Longitude
        <input type="number" id="lon" min="-180" max="180" step="any" />
      </label>
      <label class="field">Radius (mi)
        <input type="number" id="radius" value="25" step="any" />
      </label>
      <label class="field">Top K
        <input type="number" id="topk" value="10" min="1" max="50" step="1" />
      </label>
      <div class="actions">
        <button class="action primary" type="submit">Search</button>
        <button class="action" type="button" onclick="useMyLocation()">My Location</button>
      </div>
    </form>

    <div id="main">
      <div id="map" aria-label="Restaurant map"></div>
      <aside id="sidebar" aria-label="Search results and saved searches">
        <h2>Search Results</h2>
        <div id="results-list"><p class="empty">Run a search to see results here.</p></div>
        <section id="saved-panel">
          <h2>Saved States</h2>
          <input type="text" id="state-name" aria-label="Saved search name" placeholder="Saved search name (optional)" />
          <div class="actions"><button class="action" type="button" onclick="saveState()">Save State</button></div>
          <div id="saved-list"><p class="empty">No saved states yet.</p></div>
        </section>
      </aside>
    </div>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Use canvas renderer so 13k dots don't freeze the browser
  const renderer = L.canvas({ padding: 0.5 });

  const map = L.map('map').setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const greyStyle    = { renderer, radius: 3, fillColor: '#6c7086', color: '#6c7086', weight: 0, fillOpacity: 0.55 };
  const highlightStyle = { radius: 9, fillColor: '#d45139', color: '#fff', weight: 2, fillOpacity: 0.95 };
  const pinIcon = L.divIcon({
    className: '',
    html: '<div style="position:relative;width:20px;height:34px">'
        + '<div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:#47ac89;border:3px solid #143d34;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,0.5)"></div>'
        + '<div style="position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:50%;background:#143d34"></div>'
        + '</div>',
    iconSize: [20, 34],
    iconAnchor: [10, 34],
    popupAnchor: [0, -36],
  });

  let restaurantLookup = {};   // business_id → {lat, lon, name, address, city, state}
  let resultMarkers = [];
  let userMarker = null;
  let searchVersion = 0;
  let lastSearchState = null;

  const amenityFields = [
    ['GoodForKids', 'Kid friendly'], ['OutdoorSeating', 'Outdoor seating'],
    ['RestaurantsTakeOut', 'Takeout'], ['RestaurantsDelivery', 'Delivery'],
    ['RestaurantsReservations', 'Reservations'], ['RestaurantsGoodForGroups', 'Groups'],
    ['HasTV', 'TV'], ['HappyHour', 'Happy hour'], ['Caters', 'Catering'],
    ['BikeParking', 'Bike parking'], ['WheelchairAccessible', 'Wheelchair access'],
    ['DogsAllowed', 'Dogs allowed'], ['BusinessAcceptsCreditCards', 'Credit cards'],
    ['Alcohol', 'Alcohol'], ['WiFi', 'Wi-Fi'], ['NoiseLevel', 'Noise level'],
    ['RestaurantsAttire', 'Attire'], ['Smoking', 'Smoking']
  ];

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function amenityBadge(value, label) {
    if (value == null || value === '') return `<span class="amenity unknown">${label}: unknown</span>`;
    if (value === true || value === false) {
      return `<span class="amenity ${value ? '' : 'no'}">${label}: ${value ? 'Yes' : 'No'}</span>`;
    }
    const clean = String(value).replace(/^u?['"]|['"]$/g, '');
    return `<span class="amenity detail">${label}: ${escapeHtml(clean)}</span>`;
  }

  function amenitiesHtml(venue, all = false) {
    const fields = all ? amenityFields.filter(([key], index) => index < 2 || venue[key] != null) : amenityFields.slice(0, 2);
    return `<div class="amenities${all ? ' popup-amenities' : ''}">${fields.map(([key, label]) => amenityBadge(venue[key], label)).join('')}</div>`;
  }

  function resultPopup(venue, result, rank) {
    return `<div class="venue-popup">
      <div class="popup-name">#${rank} ${escapeHtml(venue.name)}</div>
      <div class="popup-address">${escapeHtml(venue.address || '')}, ${escapeHtml(venue.city || '')}</div>
      <div class="popup-metrics">
        <div><strong>Distance:</strong> ${(result.distance_meters / 1000).toFixed(2)} km</div>
        <div><strong>BM25:</strong> ${result.bm25_score.toFixed(3)} · <strong>Spatial:</strong> ${result.spatial_score.toFixed(3)}</div>
        <div><strong>Final score:</strong> ${result.final_score.toFixed(3)}</div>
      </div>
      <details><summary>Venue amenities</summary>${amenitiesHtml(venue, true)}</details>
    </div>`;
  }

  function resultCard(result, venue, rank) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'result-card';
    card.innerHTML = `<span class="rank">#${rank}</span>
      <div class="name">${escapeHtml(venue.name)}</div>
      <div class="meta">${escapeHtml(venue.address || '')} · ${(result.distance_meters / 1000).toFixed(2)} km away</div>
      ${amenitiesHtml(venue)}
      <div class="scores">BM25: ${result.bm25_score.toFixed(3)} · Spatial: ${result.spatial_score.toFixed(3)} · Final: ${result.final_score.toFixed(3)}</div>`;
    return card;
  }

  // Load all restaurants once
  const restaurantsReady = fetch('/api/restaurants')
    .then(r => {
      if (!r.ok) throw new Error(`Restaurant data request failed (${r.status})`);
      return r.json();
    })
    .then(data => {
      data.forEach(r => {
        restaurantLookup[r.business_id] = r;
        if (Number.isFinite(r.lat) && Number.isFinite(r.lon)) {
          const p = r;
          const popup = `<div class="venue-popup">
            <div class="popup-name">${escapeHtml(p.name)}</div>
            <div class="popup-address">${escapeHtml(p.address || '')}, ${escapeHtml(p.city || '')}, ${escapeHtml(p.state || '')}</div>
            <div class="popup-metrics"><div><strong>Rating:</strong> ${p.stars ?? '—'} stars</div><div><strong>Reviews:</strong> ${p.review_count || 0}</div></div>
            <details><summary>Venue amenities</summary>${amenitiesHtml(p, true)}</details>
          </div>`;
          L.circleMarker([r.lat, r.lon], greyStyle)
            .bindPopup(popup)
            .addTo(map);
        }
      });
      document.getElementById('status').textContent = `${data.length} restaurants loaded`;
      return true;
    })
    .catch(err => {
      document.getElementById('status').textContent = 'Failed to load restaurants: ' + err.message;
      return false;
    });

  function useMyLocation() {
    if (!navigator.geolocation) { document.getElementById('status').textContent = 'Geolocation not supported'; return; }
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('lon').value = pos.coords.longitude.toFixed(6);
      map.setView([pos.coords.latitude, pos.coords.longitude], 13);
    }, () => { document.getElementById('status').textContent = 'Could not get location. Click the map or enter coordinates.'; });
  }

  async function runSearch() {
    const version = ++searchVersion;
    lastSearchState = null;
    if (!await restaurantsReady || version !== searchVersion) return;
    const query = document.getElementById('query').value.trim();
    const lat   = parseFloat(document.getElementById('lat').value);
    const lon   = parseFloat(document.getElementById('lon').value);
    const radius = Number(document.getElementById('radius').value || 25);
    const topk   = Number(document.getElementById('topk').value || 10);

    if (!query || !Number.isFinite(lat) || lat < -90 || lat > 90 ||
        !Number.isFinite(lon) || lon < -180 || lon > 180 ||
        !Number.isFinite(radius) || radius <= 0 ||
        !Number.isInteger(topk) || topk < 1 || topk > 50) {
      document.getElementById('status').textContent = 'Enter a query, valid coordinates, a positive radius, and Top K between 1 and 50.';
      return;
    }

    document.getElementById('status').textContent = 'Searching…';
    document.getElementById('results-list').innerHTML = '';

    resultMarkers.forEach(m => map.removeLayer(m));
    resultMarkers = [];
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }

    userMarker = L.marker([lat, lon], { icon: pinIcon })
      .bindPopup('<b>Your location</b>')
      .addTo(map);

    const url = `/api/search?query=${encodeURIComponent(query)}&lat=${lat}&lon=${lon}&radius_miles=${radius}&top_k=${topk}`;
    fetch(url)
      .then(async response => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Search failed (${response.status})`);
        return data;
      })
      .then(results => {
        if (version !== searchVersion) return;
        if (results.error) {
          document.getElementById('status').textContent = 'Error: ' + results.error;
          return;
        }
        document.getElementById('status').textContent = `${results.length} result(s) found`;
        lastSearchState = { query, lat, lon, radius, topk, results };

        const list = document.getElementById('results-list');
        list.innerHTML = '';

        if (!results.length) {
          list.innerHTML = '<p class="empty">No results found for this query and location.</p>';
          return;
        }

        results.forEach((r, i) => {
          const info = restaurantLookup[r.restaurant_id];
          if (!info) return;

          const m = L.circleMarker([info.lat, info.lon], highlightStyle)
            .bindPopup(resultPopup(info, r, i + 1))
            .addTo(map);
          resultMarkers.push(m);

          const card = resultCard(r, info, i + 1);
          card.onclick = () => { map.setView([info.lat, info.lon], 14); m.openPopup(); };
          list.appendChild(card);
        });

        map.setView([lat, lon], 12);
      })
      .catch(err => {
        if (version !== searchVersion) return;
        document.getElementById('status').textContent = 'Error: ' + err.message;
      });
  }

  document.getElementById('controls').addEventListener('submit', event => {
    event.preventDefault();
    runSearch();
  });

  map.on('click', e => {
    document.getElementById('lat').value = e.latlng.lat.toFixed(6);
    document.getElementById('lon').value = e.latlng.lng.toFixed(6);
  });

  const STORAGE_KEY = 'geosearch_saved_states';

  function getSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      return Array.isArray(saved) ? saved : [];
    }
    catch { return []; }
  }

  function renderSaved() {
    const saved = getSaved();
    const el = document.getElementById('saved-list');
    if (!saved.length) {
      el.innerHTML = '<p class="empty">No saved states yet.</p>';
      return;
    }
    el.innerHTML = '';
    saved.forEach((s, i) => {
      const entry = document.createElement('div');
      entry.className = 'saved-entry';
      const label = document.createElement('button');
      label.className = 'saved-label';
      label.textContent = s.label;
      label.title = s.label;
      label.onclick = () => loadState(i);
      const remove = document.createElement('button');
      remove.textContent = '✕';
      remove.setAttribute('aria-label', `Delete saved search: ${s.label}`);
      remove.onclick = () => deleteState(i);
      entry.append(label, remove);
      el.appendChild(entry);
    });
  }

  function saveState() {
    if (!lastSearchState) { document.getElementById('status').textContent = 'Complete a search before saving.'; return; }
    const { query, lat, lon } = lastSearchState;
    const label = document.getElementById('state-name').value.trim() ||
      `${query} @ (${parseFloat(lat).toFixed(3)}, ${parseFloat(lon).toFixed(3)})`;
    const state = { ...lastSearchState, label };
    const saved = getSaved();
    saved.unshift(state);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    } catch {
      document.getElementById('status').textContent = 'Could not save this search. Check browser storage availability.';
      return;
    }
    renderSaved();
    document.getElementById('status').textContent = `Saved: ${label}`;
  }

  async function loadState(i) {
    const version = ++searchVersion;
    if (!await restaurantsReady || version !== searchVersion) return;
    const s = getSaved()[i];
    if (!s) return;
    document.getElementById('query').value  = s.query;
    document.getElementById('lat').value    = s.lat;
    document.getElementById('lon').value    = s.lon;
    document.getElementById('radius').value = s.radius;
    document.getElementById('topk').value   = s.topk;
    if (Array.isArray(s.results)) {
      lastSearchState = s;
      restoreResults(s);
    } else {
      runSearch();
    }
  }

  function deleteState(i) {
    const saved = getSaved();
    saved.splice(i, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    renderSaved();
  }

  function restoreResults(s) {
    const lat = parseFloat(s.lat), lon = parseFloat(s.lon);
    resultMarkers.forEach(m => map.removeLayer(m));
    resultMarkers = [];
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    userMarker = L.marker([lat, lon], { icon: pinIcon }).bindPopup('<b>Your location</b>').addTo(map);
    const list = document.getElementById('results-list');
    list.innerHTML = '';
    s.results.forEach((r, i) => {
      const info = restaurantLookup[r.restaurant_id];
      if (!info) return;
      const m = L.circleMarker([info.lat, info.lon], highlightStyle)
        .bindPopup(resultPopup(info, r, i + 1))
        .addTo(map);
      resultMarkers.push(m);
      const card = resultCard(r, info, i + 1);
      card.onclick = () => { map.setView([info.lat, info.lon], 14); m.openPopup(); };
      list.appendChild(card);
    });
    map.setView([lat, lon], 12);
    document.getElementById('status').textContent = `Loaded: ${s.results.length} result(s)`;
  }

  renderSaved();
</script>

</body>
</html>
